repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      # Linter: auto-fix safe issues, fail on remaining violations.
      - id: ruff
        args: [--fix]
      # Formatter: rewrites files in place (uses ruff.toml automatically).
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: debug-statements

  - repo: local
    hooks:
      # Tests: run the full unittest suite on every commit.
      # pass_filenames: false + always_run: true => runs once per commit,
      # not once per staged file.
      - id: unittest
        name: unittest (discover -s tests)
        entry: python3 -m unittest discover -s tests -v
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
